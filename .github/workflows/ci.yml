name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  calculator-service:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: calculator-service
        run: npm ci
      - name: Lint
        working-directory: calculator-service
        run: npm run lint

  patientor-backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: patientor-backend
        run: npm ci
      - name: Type check
        working-directory: patientor-backend
        run: npm run tsc
      - name: Lint
        working-directory: patientor-backend
        run: npm run lint

  frontend:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: [course-info, flight-diary-frontend, patientor]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci
      - name: Lint
        working-directory: ${{ matrix.app }}
        run: npm run lint
      - name: Build
        working-directory: ${{ matrix.app }}
        run: npm run build
